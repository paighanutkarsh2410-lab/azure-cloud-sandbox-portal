<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Request Sandbox</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>



<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">


<a class="navbar-brand" href="/">

<i class="fa-solid fa-cloud"></i>

Cloud Sandbox

</a>


</div>

</nav>





<section class="hero">


<div class="container">


<div class="row justify-content-center">


<div class="col-lg-8">



<div class="cloud-card">



<h2 class="mb-4">

<i class="fa-solid fa-rocket"></i>

Request Cloud Sandbox

</h2>




<form method="POST">



<div class="mb-3">


<label class="form-label">

Full Name

</label>


<input

type="text"

name="username"

class="form-control"

placeholder="Enter your name"

required>

</div>





<div class="mb-3">


<label class="form-label">

Email Address

</label>


<input

type="email"

name="email"

class="form-control"

placeholder="Enter email"

required>


</div>






<div class="mb-3">


<label class="form-label">

Environment Type

</label>



<select

name="environment"

class="form-select">


<option>

Development

</option>


<option>

Testing

</option>


<option>

Production

</option>


</select>


</div>







<div class="mb-3">


<label class="form-label">

Azure Region

</label>



<select

name="region"

class="form-select">



<option>

Central India

</option>


<option>

South India

</option>


<option>

East US

</option>


<option>

Southeast Asia

</option>



</select>



</div>







<div class="mb-3">


<label class="form-label">

VM Size

</label>



<select

class="form-select">



<option>

Standard_B1s

</option>


<option>

Standard_B2s

</option>


<option>

Standard_D2s

</option>


</select>


</div>






<button

class="btn btn-primary w-100">


<i class="fa-solid fa-cloud-arrow-up"></i>


Deploy Sandbox


</button>





</form>




</div>



</div>



</div>


</div>


</section>






<footer>

<p>

Automated Self-Service Cloud Sandbox Provisioning Platform

</p>

</footer>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
